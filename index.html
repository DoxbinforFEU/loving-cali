<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mikhail × Cali — 13th–24th | Private Archive</title>
  <meta name="description" content="A private archive of twelve monthsary chapters, thirteenth through twenty-fourth.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Archivo:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Archivo:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="./style.css">

  <!-- Safety net: the loader is only ever removed by script.js. If JS is
       disabled or fails to run, it must never sit on top of the page and
       block clicks — hide it outright in that case. -->
  <noscript><style>.loader { display: none !important; }</style></noscript>
</head>
<body>

  <!-- ===================== LOADER ===================== -->
  <div class="loader" data-loader role="status" aria-label="Loading archive">
    <span class="loader__mark">MIKHAIL × CALI</span>
    <span class="loader__range">13 — 24</span>
    <span class="loader__bar"><span data-loader-bar></span></span>
  </div>

  <!-- ===================== NAV ===================== -->
  <header class="site-nav" data-nav>
    <span class="site-nav__mark">Mikhail × Cali</span>
    <div class="site-nav__right">
      <a class="site-nav__link" href="#archive">
        <span class="site-nav__dot" aria-hidden="true"></span>&nbsp; Archive
      </a>
    </div>
  </header>

  <main>
    <!-- ===================== HERO ===================== -->
    <section class="hero" data-hero>
      <svg class="hero__contour" data-contour viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
        <path d="M -50 620 C 200 560, 380 700, 640 610 S 1050 500, 1260 560" />
        <path d="M -50 700 C 220 660, 420 780, 660 700 S 1040 610, 1260 660" />
        <path d="M -50 780 C 240 760, 460 850, 700 790 S 1030 720, 1260 760" />
      </svg>

      <div class="hero__bleed" aria-hidden="true">
        <!-- REPLACE: photo for hero bleed (a favorite frame from the 13th–24th chapters) -->
        <img src="./assets/images/13th.svg" alt="" width="480" height="900" loading="eager" fetchpriority="high">
      </div>

      <div class="hero__vertical" aria-hidden="true">
        <span>Scroll to Enter</span>
      </div>

      <div class="hero__content">
        <span class="eyebrow hero__eyebrow">Private Archive / 2026</span>
        <p class="hero__names">Mikhail × Cali</p>
        <h1 class="hero__range">13<em>TH</em> — 24<em>TH</em></h1>
        <p class="hero__sub">An Archive of Us</p>
      </div>
    </section>

    <!-- ===================== ARCHIVE ===================== -->
    <section class="archive" id="archive">
      <div class="archive__head">
        <h2 class="archive__title">The Chapters</h2>
        <span class="archive__meta">Twelve Months<br>Thirteenth — Twenty-Fourth</span>
      </div>

      <span class="archive__progress" data-progress aria-live="polite">01 / 12</span>

      <ul class="archive__grid" data-archive-grid aria-label="Monthsary chapters">
        <!-- Cards are generated from the single monthsaries[] array in script.js -->
      </ul>

      <noscript>
        <ul class="archive__grid">
          <li><a class="archive-card" href="./monthsaries/13th/">13TH — THIRTEENTH MONTH</a></li>
          <li><a class="archive-card" href="./monthsaries/14th/">14TH — FOURTEENTH MONTH</a></li>
          <li><a class="archive-card" href="./monthsaries/15th/">15TH — FIFTEENTH MONTH</a></li>
          <li><a class="archive-card" href="./monthsaries/16th/">16TH — SIXTEENTH MONTH</a></li>
          <li><a class="archive-card" href="./monthsaries/17th/">17TH — SEVENTEENTH MONTH</a></li>
          <li><a class="archive-card" href="./monthsaries/18th/">18TH — EIGHTEENTH MONTH</a></li>
          <li><a class="archive-card" href="./monthsaries/19th/">19TH — NINETEENTH MONTH</a></li>
          <li><a class="archive-card" href="./monthsaries/20th/">20TH — TWENTIETH MONTH</a></li>
          <li><a class="archive-card" href="./monthsaries/21st/">21ST — TWENTY-FIRST MONTH</a></li>
          <li><a class="archive-card" href="./monthsaries/22nd/">22ND — TWENTY-SECOND MONTH</a></li>
          <li><a class="archive-card" href="./monthsaries/23rd/">23RD — TWENTY-THIRD MONTH</a></li>
          <li><a class="archive-card" href="./monthsaries/24th/">24TH — TWENTY-FOURTH MONTH</a></li>
        </ul>
      </noscript>
    </section>
  </main>

  <footer class="site-footer">
    <span>Mikhail × Cali</span>
    <span>Private &amp; Unlisted</span>
  </footer>

  <!-- ===================== TRANSITION SWEEP ===================== -->
  <div class="transition-sweep" data-sweep aria-hidden="true">
    <span class="transition-sweep__num" data-sweep-num></span>
  </div>

  <!-- ===================== CURSOR ===================== -->
  <div class="cursor" data-cursor aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
